server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./data/barbearia.sqlite3}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:1}
spring.jackson.default-property-inclusion=non_null
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
