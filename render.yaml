services:
  - type: web
    name: pente-fino-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURITY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Barbearia Pente Fino
